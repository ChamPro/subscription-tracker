name: Keep-alive

# Two managed free-tier services idle out on independent clocks, so one ping has
# to cover both:
#   - Supabase pauses a project that sees no database activity, which has taken
#     sign-in down more than once.
#   - Upstash archives a Redis database that sees no commands.
# /api/health probes each one directly — a real `SELECT 1` and a real Redis
# write/read round-trip — so hitting it counts as activity on both. Note that
# /demo will not do — it serves hardcoded data and touches neither service.
on:
  schedule:
    # Every 3 days at 07:00 UTC. Well inside both inactivity windows, and cheap
    # enough that drift in GitHub's cron scheduling does not matter.
    - cron: "0 7 */3 * *"
  # Allows a manual run from the Actions tab, e.g. right after restoring a
  # paused project.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging $URL"
          # Two layers of retry, for two different failures:
          #   - curl --retry covers the transport: a cold start after a quiet
          #     spell can be slow enough to time out while the database wakes.
          #   - The outer loop covers the body. The route answers 200 with
          #     "cache":"unreachable" when one Redis round-trip fails, and that
          #     has happened twice on a single sample (2026-09-10, 2026-09-28)
          #     while the very next request succeeded. One blip must not be
          #     reported as an archived database, so a verdict needs
          #     $ATTEMPTS consecutive failures, $PAUSE seconds apart.
          for attempt in $(seq 1 "$ATTEMPTS"); do
            # Never judge a stale body: a transport failure leaves no file.
            rm -f response.json
            code=$(curl --silent --show-error --location \
                        --retry 3 --retry-delay 20 --retry-all-errors \
                        --max-time 60 \
                        --output response.json --write-out '%{http_code}' \
                        "$URL") || code=000
            # Truncated: a 404 or 5xx body is a whole HTML page.
            echo "Attempt $attempt/$ATTEMPTS: HTTP $code $(head -c 200 response.json 2>/dev/null || true)"
            # A 200 that is not {"status":"ok"} would mean the route responded
            # without reaching the database, so check the body too.
            if [ "$code" = "200" ] \
               && grep -q '"status":"ok"' response.json \
               && grep -q '"cache":"ok"' response.json; then
              echo "Both services answered."
              exit 0
            fi
            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              sleep "$PAUSE"
            fi
          done
          # Every attempt failed. Diagnose from the last response, and report
          # the two failures separately because they mean different things.
          if [ "$code" != "200" ] || ! grep -q '"status":"ok"' response.json; then
            echo "::error::Postgres health check failed $ATTEMPTS times (last: HTTP $code) — the Supabase database may be paused."
            exit 1
          fi
          # An unreachable cache is not an app outage — every call site degrades
          # to a direct database read. It does mean this workflow has stopped
          # keeping Upstash awake, which is the entire reason the probe exists,
          # so it still fails here.
          echo "::error::Redis probe failed $ATTEMPTS times — the Upstash database may be idle or archived. The app still works (the cache layer degrades to direct database reads), but it is no longer being kept alive."
          exit 1
        env:
          URL: https://subscription-tracker-umber.vercel.app/api/health
          ATTEMPTS: 3
          PAUSE: 20
